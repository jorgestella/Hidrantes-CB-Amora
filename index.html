<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hidrantes CB</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif}header{height:68px;background:#b40000;color:#fff;padding:10px 15px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:19px}.sub{font-size:11px}.gps{background:#fff;color:#b40000;border:0;border-radius:10px;padding:10px;font-weight:700}#map{height:calc(100vh - 68px)}.sheet{position:fixed;z-index:1000;left:12px;right:12px;bottom:12px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 3px 22px #0003;max-height:45vh;overflow:auto}.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #eee}.dot{width:14px;height:14px;border-radius:50%;background:#d71920}.info{flex:1}.name{font-weight:750}.meta{font-size:12px;color:#68737d}.open{background:#b40000;color:#fff;border:0;border-radius:9px;padding:9px;font-weight:700}.muted{font-size:12px;color:#69747d}</style></head><body><header><div><h1>🚒 Hidrantes CB</h1><div class="sub">Marcos de água mais próximos</div></div><button class="gps" onclick="locate()">📍 A minha posição</button></header><div id="map"></div><div class="sheet"><b>Marcos mais próximos</b><div id="status" class="muted">A obter localização GPS…</div><div id="list"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const hs=[['MA-023',38.6135,-9.1040,'Rua dos Bombeiros','Operacional'],['MA-017',38.6170,-9.0970,'Av. da República','Operacional'],['MA-041',38.6090,-9.0940,'Rua 25 de Abril','Operacional'],['MA-008',38.6060,-9.1120,'Estrada Principal','Necessita verificação']];
const map=L.map('map').setView([38.61,-9.105],14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const icon=L.divIcon({className:'',html:'<div style="width:18px;height:18px;background:#d71920;border:3px solid white;border-radius:50%"></div>',iconSize:[18,18],iconAnchor:[9,9]});const ms={};hs.forEach(h=>{let m=L.marker([h[1],h[2]],{icon}).addTo(map);ms[h[0]]=m;m.bindPopup('<b>'+h[0]+'</b><br>'+h[3]+'<br>'+h[4]+'<br><br><button onclick="nav('+h[1]+','+h[2]+')">🧭 Navegar</button>')});
let um;
function dist(a,b){const R=6371000,p=Math.PI/180,dl=(b[0]-a[0])*p,dn=(b[1]-a[1])*p,x=Math.sin(dl/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function show(p){let pos=[p.coords.latitude,p.coords.longitude];if(um)map.removeLayer(um);um=L.circleMarker(pos,{radius:8,color:'#fff',weight:3,fillColor:'#1677ff',fillOpacity:1}).addTo(map).bindPopup('📍 A tua posição');map.setView(pos,15);let a=hs.map(h=>({...h,d:Math.round(dist(pos,[h[1],h[2]]))})).sort((a,b)=>a.d-b.d);document.getElementById('status').textContent='Localização obtida · '+a.length+' marcos';document.getElementById('list').innerHTML=a.map(h=>'<div class="item"><span class="dot"></span><div class="info"><div class="name">'+h[0]+'</div><div class="meta">'+h[3]+' · '+h.d+' m · '+h[4]+'</div></div><button class="open" onclick="focusH(\''+h[0]+'\')">Abrir</button></div>').join('')}
function locate(){document.getElementById('status').textContent='A pedir autorização de localização…';if(!navigator.geolocation){document.getElementById('status').textContent='GPS não suportado.';return}navigator.geolocation.getCurrentPosition(show,()=>document.getElementById('status').textContent='GPS não autorizado. Permite a localização no navegador e tenta novamente.',{enableHighAccuracy:true,timeout:15000,maximumAge:10000})}
function focusH(id){let h=hs.find(x=>x[0]===id);map.setView([h[1],h[2]],18);ms[id].openPopup()}function nav(a,b){location.href='https://www.google.com/maps/dir/?api=1&destination='+a+','+b}locate();
</script></body></html>
